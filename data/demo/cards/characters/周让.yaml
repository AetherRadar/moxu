description: "男，十九岁，普通大学土木专业新生，夜间巡楼勤工助学。身份：大学生、夜间巡楼勤工助学人员。目标：最初只是平安回宿舍、保住兼职，后来才开始寻\
  找失踪同学。性格：谨慎，不擅长在人群中发号施令；紧张时会反复确认细节；怕担责任，容易相信正式通知。能力与限制：熟悉校园建筑、门锁和维修通道，记性较好，没有超常智\
  力；第一卷保持普通人身份。关系：室友为赵小川；与陈芮、姚德成、吴凯等人物会在校内事件中产生联系；与吴凯原本并不熟悉。成长阶段：校园求生、追查失踪、被迫借力、承担\
  代价、独立处置；第一卷成长首先体现为观察能力、判断力和承担后果的勇气。缺点：第一次自作聪明的试探会造成严重后果。"
stars: 3
