content: "【故事核心】\n《缺席者》表面写眼前困局，实则一步步揭露更大的世界、规则与隐藏结构，让故事越往后越显出层次。\n\n【长线结构】\n- 前段：先\
  以局部异样或具体危机抓住读者\n- 中段：把零散异常串成系统性问题，让读者意识到背后另有盘面\n- 后段：让主角真正踏入更大舞台，面对一个重新定义前文的真相\n\
  \n【现有参考】\n分卷 V1 · Volume 1 V1C1 消失的人\n\n【补充要求】\n都市灵异、校园恐怖、规则推理、慢成长。采用“灵异复苏、厉鬼难以消\
  灭、借用力量必付代价”的方向，人物和事件原创。\n\n【结局方向】\n适合走“第一层问题解决，但更大真相成立”的结局类型。"
